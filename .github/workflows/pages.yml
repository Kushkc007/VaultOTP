name: Deploy web app to GitHub Pages

# The built site is published straight to the `gh-pages` branch. Publishing a branch
# (instead of an Actions artifact) keeps the deployment deterministic: there is no
# artifact service in the path, so a deploy cannot fail with "Artifact ... not found".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Smoke-test the built app
        run: |
          node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("web/index.html", "utf8");
            const version = require("./package.json").version;
            const checks = {
              "app version in the page": html.includes(`"${version}"`) || html.includes(`>${version}<`),
              "manifest linked": html.includes("manifest.webmanifest"),
              "service worker registered": html.includes("serviceWorker"),
              "no remote scripts or fonts": !/(src|href)="https?:\/\//i.test(html),
              "nojekyll present": fs.existsSync("web/.nojekyll"),
            };
            for (const [name, ok] of Object.entries(checks)) {
              console.log(`${ok ? "ok  " : "FAIL"} ${name}`);
              if (!ok) process.exitCode = 1;
            }
          '

      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd web
          git init -q -b gh-pages
          git config user.name "VaultOTP"
          git config user.email "vaultotp@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA:0:7} — $(node -p "require('../package.json').version")"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "published https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
