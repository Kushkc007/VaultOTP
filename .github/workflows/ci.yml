name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Unit tests (RFC 6238 vectors + repo hygiene)
        run: npm test

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build web + single-file bundle
        run: npm run build

      - name: Verify the build is self-contained
        run: |
          test -f web/index.html
          test -f web/VaultOTP.html
          test -f web/sw.js
          test -f web/manifest.webmanifest
          # Nothing in the built app may reference a third-party origin.
          ! grep -Eio '(src|href)="https?://[^"]+' web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: vaultotp-web
          path: |
            web/**
            !web/.nojekyll
          retention-days: 14
