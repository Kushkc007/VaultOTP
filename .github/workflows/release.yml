name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Package web + single file
        run: |
          cd web
          zip -r ../VaultOTP-web.zip . -x '.nojekyll'
          cd ..
          cp web/VaultOTP.html VaultOTP-single-file.html
      - name: Checksums
        run: sha256sum VaultOTP-web.zip VaultOTP-single-file.html > VaultOTP-web.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: |
            VaultOTP-web.zip
            VaultOTP-single-file.html
            VaultOTP-web.sha256

  windows:
    name: Windows EXE
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Build portable EXE + installer
        run: npm run build:desktop
        env:
          # Optional: signing certificate (base64 .pfx) and password
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checksums
        shell: bash
        run: |
          cd dist/desktop
          sha256sum *.exe > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          retention-days: 3
          path: |
            dist/desktop/*.exe
            dist/desktop/SHA256SUMS.txt

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships the Android SDK; android-actions/setup-android
      # fails on its own licence step, so talk to sdkmanager directly.
      - name: Install SDK platform + build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --list 2>&1 | grep -E "platforms;android-3[4-9]" | head -5
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install             "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -15

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build APK
        env:
          VAULTOTP_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VAULTOTP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VAULTOTP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VAULTOTP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:android

      - name: Rename artefacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/VaultOTP-${VERSION}.apk"
          fi
          if [ -f mobile/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "out/VaultOTP-${VERSION}-debug.apk"
          fi
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          retention-days: 3
          path: out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-checksums
          path: out/SHA256SUMS.txt

  publish:
    name: Publish GitHub release
    # A manual dispatch run has no tag, so it builds and verifies without publishing.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [web, windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.zip' -o -name '*.html' -o -name '*.dmg' -o -name '*.AppImage' -o -name 'SHA256SUMS.txt' -o -name '*.sha256' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: VaultOTP ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## VaultOTP ${{ github.ref_name }}

            | Platform | File |
            |---|---|
            | 🌐 Web (all files) | `VaultOTP-web.zip` |
            | 🌐 Web (single file) | `VaultOTP-single-file.html` |
            | 🖥️ Windows (portable) | `VaultOTP-*-portable.exe` |
            | 🖥️ Windows (installer) | `VaultOTP-Setup-*.exe` |
            | 📱 Android | `VaultOTP-*.apk` |
            | 🍎 macOS | `VaultOTP-*.dmg` (attached by the **Build macOS app** workflow) |

            Verify downloads with the bundled `SHA256SUMS.txt`.

            **Everyone runs the same `src/app.html`** — the web app, EXE and APK contain identical
            authenticator code. `npm test` validates it against the official RFC 6238 vectors.
    permissions:
      contents: write

  cleanup:
    name: Free artifact storage
    runs-on: ubuntu-latest
    needs: [publish]
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete this run's artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null || true
          done
          echo "artifacts left in the repository:"
          gh api "/repos/${{ github.repository }}/actions/artifacts" --jq '.total_count'
