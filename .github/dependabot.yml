version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # Electron majors are a deliberate, tested upgrade — see docs/BUILD.md
      - dependency-name: electron
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
